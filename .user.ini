; PHP settings for this site (read automatically by cPanel / PHP-FPM / LiteSpeed hosts).
; Hide PHP errors from visitors; they are logged privately in data/php-errors.log instead.
display_errors = Off
display_startup_errors = Off
log_errors = On
; Allow product photos up to 5 MB (the admin panel enforces 5 MB itself).
upload_max_filesize = 8M
post_max_size = 10M
